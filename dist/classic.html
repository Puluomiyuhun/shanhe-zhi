<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>山河志 · 三国行记</title><meta name="description" content="三国单武将扮演：游历山河、结交名士、受托办事。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23743932'/%3E%3Ctext x='4' y='25' font-size='25' fill='%23eadbbc'%3E山%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body><header class="topbar"><div class="brand"><b>山河志</b><span>三国行记</span></div><div class="era"><span class="seal">汉</span><div><b id="date"></b><small>群雄并起 · 演义沙盘</small></div></div><div class="resources"><span>钱 <b id="money"></b></span><span>名 <b id="fame"></b></span><span>力 <b id="energy"></b><small>/100</small></span></div><div class="top-actions"><span id="saveStatus">本机行记</span><button id="save" title="手动保存">保存</button><button id="help" aria-label="玩法与地图来源">?</button></div></header>
<main id="world"><canvas id="map" tabindex="0" aria-label="天下地图：拖动平移，滚轮或加减键缩放，方向键平移。可用寻城菜单选择城池。"></canvas><div class="map-vignette"></div><nav class="hanging-nav" aria-label="行旅菜单"><button id="personNav"><span>◈</span>人物</button><button id="relationsNav"><span>☷</span>人脉</button><button id="tasksNav"><span>▤</span>委托<i id="taskBadge" hidden>1</i></button><button id="journalNav"><span>≋</span>行记</button></nav><div class="atlas-title"><span>天下舆图</span><small>初平 · 山川形胜</small></div><div class="map-tools"><button data-ui="cities" class="directory-button">郡邑录</button><select id="citySearch" aria-label="寻城"><option value="">寻城 · 九十九郡邑</option></select><div class="layer-switch" aria-label="地图图层"><button data-layer="terrain" aria-pressed="false">山川</button><button data-layer="factions" class="active" aria-pressed="true">势力</button><button id="ecologyToggle" class="active" aria-pressed="true" title="显示或隐藏林地、田畴与荒漠纹理">风物</button></div></div>
<div class="player-summary bronze"><div class="portrait-seal">沈</div><div><b>沈行舟</b><span id="rank"></span><small id="playerPlace"></small></div><button id="center" aria-label="定位角色">⌖</button></div>
<aside id="cityPanel" class="city-panel parchment"><div class="panel-caption"><span id="region"></span><button id="collapseCity" aria-expanded="true" aria-label="收起城池详情">−</button></div><div id="cityBody"><div class="city-heading"><h1 id="cityName"></h1><span id="owner" class="faction-tag"></span></div><p id="cityDesc"></p><div class="city-stats"><span>民心<b id="public"></b></span><span>守军<b id="troops"></b></span><span>人物<b id="npcCount"></b></span></div><div id="cityAction"></div><button id="geoInfo" class="text-button">城址考据 ↗</button></div></aside>
<aside id="factionLegend" class="faction-legend bronze" aria-label="势力图例"></aside><div id="taskTracker" class="task-tracker bronze"></div><div class="map-bottom"><div class="map-caption"><b>舆图据地理坐标定位</b><span>远览留城标 · 悬停见城名 · 滚轮缩放</span></div><div class="map-controls"><button id="zoomOut" aria-label="缩小">−</button><span id="scale">100%</span><button id="zoomIn" aria-label="放大">＋</button><button id="fit">全图</button></div></div><div class="compass" aria-hidden="true">北<span>✧</span>南</div><div id="hoverLabel" hidden></div></main>
<footer><div class="journey-state"><span class="state-dot"></span><div><b id="activityTitle"></b><small id="activityDetail"></small></div></div><div class="time-controls"><button id="auto" aria-pressed="false">▶ 继续</button><select id="speed" aria-label="时间流速"><option value="1200">一倍速</option><option value="450">三倍速</option></select><button id="next">过一日</button></div><button id="enter" class="primary">进入襄阳 <span>→</span></button></footer>
<dialog id="dialog"><div class="dialog-cap"><span>山河志 · 行旅</span><button id="closeDialog" aria-label="关闭窗口">×</button></div><div id="dialogContent"></div></dialog><div id="toast" role="status"></div><script src="data.js"></script><script src="engine.js"></script><script src="ecology.js"></script><script src="territories.js"></script><script src="atlas.js"></script><script src="game.js"></script></body></html>
